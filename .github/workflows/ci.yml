name: Fractal-BLT CI

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Run Tests
      run: dotnet test --no-restore --verbosity normal

    - name: Build FractalCore (Release)
      run: dotnet build FractalCore/FractalCore.csproj -c Release --no-restore

    - name: Build FractalServe (Release)
      run: dotnet build FractalServe/FractalServe.csproj -c Release --no-restore

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    - name: Install NativeAOT Prerequisites (Linux)
      run: sudo apt-get install -y clang zlib1g-dev

    - name: Publish Linux NativeAOT
      run: dotnet publish FractalServe/FractalServe.csproj -c Release -r linux-x64 /p:PublishAot=true -o ./publish-linux

    - name: Zip Linux Binaries
      run: zip -r fractal-blt-linux-x64.zip ./publish-linux/*

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: fractal-blt-linux-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
